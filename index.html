<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Termómetro Emocional 3D</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="termometro-emocional">
    <h2>¿Cómo te sientes hoy?</h2>
    <div id="carita" class="carita">
      <div class="cejas-container">
        <div id="ceja-izq" class="ceja"></div>
        <div id="ceja-der" class="ceja"></div>
      </div>
      <div class="ojo izquierdo"></div>
      <div class="ojo derecho"></div>
      <div id="boca" class="boca"></div>
    </div>
    
    <p id="texto-emocion" class="texto-emocion">Calmado / Bien 😌</p>
    <!-- Recuerda verificar que el max de tu barra sea 7 -->
    <input type="range" id="control-emocion" min="1" max="7" value="4" step="1">
  </div>

  <!-- LÍNEA INDISPENSABLE: Carga el motor de partículas de confeti en el navegador -->
  <script src="https://jsdelivr.net"></script>
  
  <!-- Tu archivo de lógica JavaScript -->
  <script src="cfeli.js"></script>
</body>
</html>
