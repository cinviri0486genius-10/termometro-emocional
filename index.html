<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Termómetro Emocional 3D</title>
  <link rel="stylesheet" href="style.css">
  <!-- Enlace para cargar la tipografía Black Ops One desde Google Fonts -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

  <!-- VENTANA DE REGISTRO DE NOMBRE (MODAL ARCADE) -->
  <div id="modal-registro" class="modal-registro">
    <div class="tarjeta-registro">
      <h3>¡Hola! ¿Cómo te llamas?</h3>
      <input type="text" id="nombre-usuario" placeholder="Escribe tu nombre aquí...">
      <button id="btn-guardar-nombre">Entrar</button>
    </div>
  </div>

  <!-- CAPA DE FONDO FRONTAL: Aquí se generarán las gotas dinámicamente con JavaScript -->
  <div id="lluvia-container" class="lluvia-container"></div>

  <!-- TARJETA CONTENEDORA PRINCIPAL -->
  <div class="termometro-emocional">
    <h2>¿Cómo te sientes hoy?</h2>
    <div id="carita" class="carita">
      <div class="cejas-container">
        <div id="ceja-izq" class="ceja"></div>
        <div id="ceja-der" class="ceja"></div>
      </div>
      <div class="ojo izquierdo"></div>
      <div class="ojo derecho"></div>
      <div id="boca" class="boca"></div>
    </div>
    
    <p id="texto-emocion" class="texto-emocion">Calmado / Bien 😌</p>
    <input type="range" id="control-emocion" min="1" max="7" value="4" step="1">

    <!-- BOTÓN MULTI-USUARIO: Permite borrar la memoria y registrar a otro niño -->
    <button id="btn-cambiar-usuario" class="btn-cambiar-usuario">Cambiar de Niño(a) 🔄</button>
  </div>

  <!-- LÍNEA INDISPENSABLE: Carga el motor de partículas de confeti en el navegador -->
  <script src="https://jsdelivr.net"></script>
  
  <!-- Tu archivo de lógica JavaScript -->
  <script src="cfeli.js"></script>
</body>
</html>
