<body>

  <div class="termometro-emocional">
    <h2>¿Cómo te sientes hoy?</h2>

      <div class="cejas-container">
        <div id="ceja-izq" class="ceja"></div>

      </div>
      <div class="ojo izquierdo"></div>
      <div class="ojo derecho"></div>
      <div id="boca" class="boca"></div>

    <p id="texto-emocion" class="texto-emocion">Calmado / Bien 😌</p>
     <input type="range" id="control-emocion" min="1" max="7" value="4" step="1">
  </div>
